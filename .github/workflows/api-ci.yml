# cales-breathe-v2-api：於變更後端程式或本檔時跑 pytest（後端面試改善計畫項目 F）。
name: API CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cales-breathe-v2-api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "cales-breathe-v2-api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: cales-breathe-v2-api

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cales-breathe-v2-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest
