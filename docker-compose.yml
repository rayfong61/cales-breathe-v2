services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cales_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cales}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./cales-breathe-v2-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./cales-breathe-v2-api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cales}:${POSTGRES_PASSWORD:-cales_dev_change_me}@postgres:5432/${POSTGRES_DB:-cales}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost/api}
        VITE_LINE_ADD_FRIEND_URL: ${VITE_LINE_ADD_FRIEND_URL:-https://line.me/R/ti/p/@033ikgzv}
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
